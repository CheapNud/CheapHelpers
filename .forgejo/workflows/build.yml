name: Build

# Runs on every pull request and on every master commit. Master only moves through
# merged PRs, and a release pushes its tag only after the master build of the merged
# bump PR has finished. A direct master push next to a tag push once raced the tag
# publish for the runner's shared toolcache volume and stalled both; the ordering
# above keeps the two builds apart, and the shared concurrency group below queues one
# behind the other if they ever do meet. Never push master by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

# Shared with publish.yml: both compile on the runner's one toolcache volume.
concurrency:
  group: dotnet-toolcache
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No setup-dotnet: the ubuntu-latest label maps to a runner image with the
      # .NET 11 SDK baked in (ci-dotnet), so the SDK download is gone too.
      # No actions/cache: the runner mounts a persistent nuget-ci-cache volume
      # into every job (act_runner container.options) — restore hits a warm local
      # cache without the tar-and-transfer round trip the cache action cost.
      # CI solution excludes MAUI and MediaProcessing (Windows-only packaging)
      - name: Restore
        run: dotnet restore CheapHelpers.CI.slnx

      - name: Build
        run: dotnet build CheapHelpers.CI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CheapHelpers.CI.slnx --configuration Release --no-build --verbosity normal || echo "No test projects found"
