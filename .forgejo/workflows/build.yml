name: Build

# PR-only on purpose: every master commit arrives through a PR this already
# validated, and the tag publish rebuilds anyway. A master-push trigger races
# the tag publish's build for the runner's shared toolcache volume when a
# release pushes master and the tag together, which stalls both mid-compile.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No setup-dotnet: the ubuntu-latest label maps to a runner image with the
      # .NET 11 SDK baked in (ci-dotnet), so the SDK download is gone too.
      # No actions/cache: the runner mounts a persistent nuget-ci-cache volume
      # into every job (act_runner container.options) — restore hits a warm local
      # cache without the tar-and-transfer round trip the cache action cost.
      # CI solution excludes MAUI and MediaProcessing (Windows-only packaging)
      - name: Restore
        run: dotnet restore CheapHelpers.CI.slnx

      - name: Build
        run: dotnet build CheapHelpers.CI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CheapHelpers.CI.slnx --configuration Release --no-build --verbosity normal || echo "No test projects found"
