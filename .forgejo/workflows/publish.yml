name: Publish NuGet

# Release mechanism: push a v*.*.* tag; the tag minus its v is the version of every package.
# Base packages build on the Linux runner pool (x-8,
# ubuntu-latest = the ci-dotnet image with the .NET 11 SDK baked in, so no actions/setup-dotnet);
# MAUI + MediaProcessing pack on the Windows runner (SANCTUARY) using the host SDK/workloads
# directly — no actions/setup-dotnet on Windows either (installing an SDK there triggers a UAC prompt
# that wedges the job, and the host already has the .NET 11 SDK + MAUI workload we build with).

on:
  push:
    tags:
      - 'v*.*.*'

# Shared with the master build in build.yml: the two must not compile on the toolcache volume at once.
concurrency:
  group: dotnet-toolcache
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        run: dotnet restore CheapHelpers.CI.slnx
      - name: Build
        run: dotnet build CheapHelpers.CI.slnx --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test CheapHelpers.CI.slnx --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal || echo "No test projects found"

  # 9 base packages (CI solution excludes MAUI + MediaProcessing)
  publish-base:
    name: Publish Base Packages
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Source Link at the GitHub mirror
        run: git remote set-url origin https://github.com/CheapNud/CheapHelpers.git
      - name: Pack base packages
        run: dotnet pack CheapHelpers.CI.slnx --configuration ${{ env.CONFIGURATION }} -p:EnableWindowsTargeting=true -p:Version=${GITHUB_REF_NAME#v} --output ./nupkgs
      - name: Publish base packages to NuGet.org
        # --no-symbols: some snupkgs contain no .pdb (nuget.org rejects them with 400, which
        # aborts the loop). The old GitHub workflow masked this with `|| true` — symbols were
        # never reliably published. Fixing snupkg generation is tracked in TODO.
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate --no-symbols
          done
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # MAUI packs on Windows (MakePri.exe + the Android/iOS/Windows target chain). Independent of
  # publish-base — packs against local ProjectReferences, resolves base packages from NuGet at consume time.
  publish-maui:
    name: Publish MAUI
    needs: build-test
    runs-on: windows
    env:
      # Short cache root instead of the repo-local packages folder: under the runner's
      # deep systemprofile workspace the androidx aar paths overflow MAX_PATH and
      # Xamarin.Android fails with XA1004 "probably corrupt"
      NUGET_PACKAGES: C:\nupkgcache
    defaults:
      run:
        # cmd, not powershell: the runner service runs as LocalSystem, whose Restricted
        # execution policy blocks generated .ps1 step scripts — batch files are immune
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Point Source Link at the GitHub mirror
        run: git remote set-url origin https://github.com/CheapNud/CheapHelpers.git
      - name: Restore MAUI
        run: dotnet restore CheapHelpers.MAUI/CheapHelpers.MAUI.csproj
      - name: Read the version from the tag
        run: echo VERSION=%GITHUB_REF_NAME:~1%>> %GITHUB_ENV%
      - name: Pack MAUI
        # Restore needs no -p:Version: pack asks each referenced project for its version, so
        # project-reference dependencies get the tag even though project.assets.json says 0.0.0-local
        run: dotnet pack CheapHelpers.MAUI/CheapHelpers.MAUI.csproj --configuration ${{ env.CONFIGURATION }} --no-restore -p:Version=%VERSION% --output ./nupkgs
      - name: Publish MAUI to NuGet.org
        run: dotnet nuget push nupkgs\*.nupkg --api-key %NUGET_API_KEY% --source %NUGET_SOURCE% --skip-duplicate --no-symbols
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # MediaProcessing has a net11.0-windows target (WMI) — Windows-only. Published after base so its
  # base-package dependencies are indexed on NuGet before a consumer restores it.
  publish-media:
    name: Publish MediaProcessing
    needs: publish-base
    runs-on: windows
    defaults:
      run:
        # cmd, not powershell: see publish-maui
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Point Source Link at the GitHub mirror
        run: git remote set-url origin https://github.com/CheapNud/CheapHelpers.git
      - name: Wait for NuGet indexing
        # ping as sleep: timeout /t needs an interactive console the runner lacks
        run: |
          echo Waiting 10 minutes for NuGet to index base packages...
          ping -n 601 127.0.0.1 >nul
      - name: Restore MediaProcessing
        run: dotnet restore CheapHelpers.MediaProcessing/CheapHelpers.MediaProcessing.csproj -p:EnableWindowsTargeting=true
      - name: Read the version from the tag
        run: echo VERSION=%GITHUB_REF_NAME:~1%>> %GITHUB_ENV%
      - name: Pack MediaProcessing
        # Restore needs no -p:Version: see Pack MAUI
        run: dotnet pack CheapHelpers.MediaProcessing/CheapHelpers.MediaProcessing.csproj --configuration ${{ env.CONFIGURATION }} --no-restore -p:EnableWindowsTargeting=true -p:Version=%VERSION% --output ./nupkgs
      - name: Publish MediaProcessing to NuGet.org
        run: dotnet nuget push nupkgs\CheapHelpers.MediaProcessing.*.nupkg --api-key %NUGET_API_KEY% --source %NUGET_SOURCE% --skip-duplicate --no-symbols
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
