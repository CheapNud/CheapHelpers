name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ master ]

env:
  DOTNET_VERSION: '11.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # CI solution excludes MAUI and MediaProcessing (Windows-only packaging)
      - name: Restore
        run: dotnet restore CheapHelpers.CI.slnx

      - name: Build
        run: dotnet build CheapHelpers.CI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CheapHelpers.CI.slnx --configuration Release --no-build --verbosity normal || echo "No test projects found"
